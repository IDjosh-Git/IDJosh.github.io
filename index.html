<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Idowu Joshua | Data Portfolio</title>

<style>

body{
margin:0;
font-family:Arial;
background:#000;
color:#fff;
}

/* NAV */
nav{
display:flex;
justify-content:space-between;
padding:20px 40px;
background:#111;
position:sticky;
top:0;
}

nav a{color:#fff;margin:0 10px;text-decoration:none}

/* SECTIONS */
section{
padding:60px 40px;
}

/* HERO */
.hero{
padding:80px 40px;
background:linear-gradient(120deg,#111,#000);
}

.hero h1{
font-size:50px;
}

.hero span{color:gold}

/* OVERVIEW */
.overview-grid{
display:grid;
grid-template-columns:repeat(auto-fit,minmax(200px,1fr));
gap:20px;
margin-top:30px;
}

.card{
background:#111;
padding:20px;
border-radius:12px;
border:1px solid #222;
}

.card h2{
margin:0;
font-size:30px;
color:gold;
}

.card p{
margin:5px 0 0;
color:#aaa;
}

/* UPLOAD */
.upload-box{
background:#111;
padding:20px;
border-radius:12px;
margin-top:20px;
}

input,select,textarea{
width:100%;
margin:8px 0;
padding:10px;
background:#000;
border:1px solid #333;
color:#fff;
border-radius:6px;
}

/* PROJECTS */
.projects-grid{
display:grid;
grid-template-columns:repeat(auto-fit,minmax(250px,1fr));
gap:20px;
margin-top:30px;
}

.project{
background:#111;
border-radius:12px;
overflow:hidden;
border:1px solid #222;
}

.project img{
width:100%;
height:160px;
object-fit:cover;
}

.project-body{
padding:15px;
}

.tag{
display:inline-block;
background:rgba(255,215,0,0.1);
color:gold;
padding:4px 8px;
border-radius:20px;
font-size:12px;
margin:2px;
}

.small{
color:#aaa;
font-size:12px;
}

</style>
</head>

<body>

<nav>
<div><b>Idowu Joshua</b></div>
<div>
<a href="#overview">Overview</a>
<a href="#upload">Upload</a>
<a href="#projects">Projects</a>
</div>
</nav>

<!-- HERO -->
<div class="hero">
<h1>Turning <span>Data</span> Into Decisions</h1>
<p>Power BI • Excel • SQL • Analytics Portfolio</p>
</div>

<!-- ================= OVERVIEW PAGE ================= -->
<section id="overview">

<h2>📊 Portfolio Overview</h2>

<div class="overview-grid">

<div class="card">
<h2 id="totalProjects">0</h2>
<p>Total Projects</p>
</div>

<div class="card">
<h2 id="powerbiCount">0</h2>
<p>Power BI Reports</p>
</div>

<div class="card">
<h2 id="excelCount">0</h2>
<p>Excel Reports</p>
</div>

<div class="card">
<h2 id="sqlCount">0</h2>
<p>SQL Projects</p>
</div>

<div class="card">
<h2 id="latestDate">-</h2>
<p>Latest Upload</p>
</div>

</div>

</section>

<!-- UPLOAD -->
<section id="upload">

<h2>Upload Report</h2>

<div class="upload-box">

<input type="text" id="title" placeholder="Report Title">
<textarea id="desc" placeholder="Description"></textarea>

<select id="category">
<option>Power BI</option>
<option>Excel</option>
<option>SQL</option>
<option>Other</option>
</select>

<input type="text" id="tools" placeholder="Tools (comma separated)">
<input type="file" id="file" multiple>

</div>

</section>

<!-- PROJECTS -->
<section id="projects">

<h2>Projects</h2>

<div class="projects-grid" id="grid"></div>

</section>

<script>

let projects = JSON.parse(localStorage.getItem("projects")) || [];

/* SAVE PROJECT */
document.getElementById("file").addEventListener("change", function(){

let files = [...this.files];

files.forEach(file=>{

let reader = new FileReader();

reader.onload = e=>{

let project = {
image:e.target.result,
title:document.getElementById("title").value || file.name,
desc:document.getElementById("desc").value || "No description",
category:document.getElementById("category").value,
tools:document.getElementById("tools").value.split(",").map(t=>t.trim()),
date:new Date().toLocaleDateString()
};

projects.push(project);

localStorage.setItem("projects",JSON.stringify(projects));

render();
overview();

};

reader.readAsDataURL(file);

});

});

/* RENDER PROJECTS */
function render(){

let grid = document.getElementById("grid");
grid.innerHTML="";

projects.forEach(p=>{

grid.innerHTML += `
<div class="project">
<img src="${p.image}">
<div class="project-body">

<div class="small">${p.category} • ${p.date}</div>
<h3>${p.title}</h3>
<p>${p.desc}</p>

<div>
${p.tools.map(t=>`<span class="tag">${t}</span>`).join("")}
</div>

</div>
</div>
`;

});

}

/* OVERVIEW LOGIC */
function overview(){

document.getElementById("totalProjects").innerText = projects.length;

document.getElementById("powerbiCount").innerText =
projects.filter(p=>p.category==="Power BI").length;

document.getElementById("excelCount").innerText =
projects.filter(p=>p.category==="Excel").length;

document.getElementById("sqlCount").innerText =
projects.filter(p=>p.category==="SQL").length;

if(projects.length>0){
document.getElementById("latestDate").innerText =
projects[projects.length-1].date;
}

}

/* INIT */
render();
overview();

</script>

</body>
</html>
