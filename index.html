<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Idowu Joshua — Data Analyst Portfolio</title>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,300;0,9..144,700;0,9..144,800;1,9..144,700;1,9..144,800&family=Cabinet+Grotesk:wght@300;400;500;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet"/>
<style>
:root{
  --ink:#07080a;--ink2:#0d0f13;--ink3:#13161c;--ink4:#191d26;--ink5:#1f232e;
  --rim:#252933;--rim2:#2e3444;
  --gold:#c9a84c;--gold2:#dbbe78;--gold-glow:rgba(201,168,76,.07);--gold-tint:rgba(201,168,76,.11);
  --em:#27b577;--em-dim:rgba(39,181,119,.08);
  --sky:#3d8ef0;--sky-dim:rgba(61,142,240,.07);
  --rose:#e04f69;
  --text:#e8ecf3;--text2:#8090a8;--text3:#4e5a6e;
  --r:6px;--r2:12px;--r3:18px;
  --nav-h:64px;
}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
html{scroll-behavior:smooth}
body{background:var(--ink);color:var(--text);font-family:'Cabinet Grotesk',sans-serif;font-weight:400;line-height:1.65;overflow-x:hidden;-webkit-font-smoothing:antialiased}
 
/* subtle dot grid */
body::before{content:'';position:fixed;inset:0;z-index:0;pointer-events:none;
  background-image:radial-gradient(circle,rgba(201,168,76,.07) 1px,transparent 1px);
  background-size:44px 44px;opacity:.55}
 
/* ambient glows */
.glow-blob{position:fixed;border-radius:50%;pointer-events:none;z-index:0;filter:blur(80px)}
.gb1{width:800px;height:800px;top:-200px;right:-150px;background:rgba(201,168,76,.035)}
.gb2{width:600px;height:600px;bottom:-150px;left:-80px;background:rgba(39,181,119,.03)}
.gb3{width:400px;height:400px;top:45%;left:45%;background:rgba(61,142,240,.02)}
 
img{display:block;max-width:100%}
a{color:inherit;text-decoration:none}
button{cursor:pointer;font-family:inherit}
::selection{background:rgba(201,168,76,.25);color:var(--text)}
 
::-webkit-scrollbar{width:4px}
::-webkit-scrollbar-track{background:var(--ink)}
::-webkit-scrollbar-thumb{background:var(--rim2);border-radius:2px}
::-webkit-scrollbar-thumb:hover{background:var(--gold)}
 
.z1{position:relative;z-index:1}
.wrap{max-width:1180px;margin:0 auto;padding:0 56px}
 
/* ── REVEAL ── */
.reveal{opacity:0;transform:translateY(24px);transition:opacity .6s cubic-bezier(.22,.68,0,1.2),transform .6s cubic-bezier(.22,.68,0,1.2)}
.reveal.vis{opacity:1;transform:none}
 
/* ── EYEBROW ── */
.eyebrow{display:inline-flex;align-items:center;gap:8px;font-family:'JetBrains Mono',monospace;font-size:9.5px;font-weight:500;letter-spacing:.26em;text-transform:uppercase;color:var(--gold);margin-bottom:12px}
.eyebrow::before{content:'';width:20px;height:1px;background:currentColor;opacity:.6}
 
/* ── HEADING ── */
.heading{font-family:'Fraunces',serif;font-size:clamp(34px,4.8vw,58px);font-weight:800;line-height:1.0;letter-spacing:-1.5px;color:var(--text);margin-bottom:16px}
.heading em{font-style:italic;color:var(--gold)}
 
/* ── TAGS ── */
.tag{display:inline-block;padding:3px 10px;font-size:9.5px;font-weight:500;letter-spacing:.1em;text-transform:uppercase;border-radius:100px}
.t-gold{background:var(--gold-tint);color:var(--gold);border:1px solid rgba(201,168,76,.22)}
.t-em{background:var(--em-dim);color:var(--em);border:1px solid rgba(39,181,119,.2)}
.t-sky{background:var(--sky-dim);color:var(--sky);border:1px solid rgba(61,142,240,.18)}
.t-dim{background:rgba(255,255,255,.04);color:var(--text3);border:1px solid var(--rim)}
 
/* ── BUTTONS ── */
.btn{display:inline-flex;align-items:center;gap:7px;padding:12px 24px;border-radius:var(--r);font-family:'Cabinet Grotesk',sans-serif;font-size:13px;font-weight:700;letter-spacing:.03em;transition:all .2s;border:none;cursor:pointer}
.btn-gold{background:var(--gold);color:var(--ink)}
.btn-gold:hover{background:var(--gold2);transform:translateY(-2px);box-shadow:0 8px 28px rgba(201,168,76,.22)}
.btn-outline{background:transparent;color:var(--text2);border:1px solid var(--rim2)}
.btn-outline:hover{border-color:var(--gold);color:var(--gold)}
.btn-em{background:var(--em-dim);color:var(--em);border:1px solid rgba(39,181,119,.2)}
.btn-em:hover{background:rgba(39,181,119,.13);transform:translateY(-2px)}
 
/* ══════ NAV ══════ */
#nav{position:fixed;top:0;left:0;right:0;z-index:400;height:var(--nav-h);display:flex;align-items:center;justify-content:space-between;padding:0 56px;background:rgba(7,8,10,.9);backdrop-filter:blur(20px) saturate(160%);border-bottom:1px solid var(--rim);transition:box-shadow .3s}
#nav.scrolled{box-shadow:0 4px 40px rgba(0,0,0,.45)}
.nav-logo{font-family:'Fraunces',serif;font-size:18px;font-weight:700;color:var(--text);letter-spacing:-.3px;display:flex;align-items:center;gap:6px}
.nav-logo em{color:var(--gold);font-style:italic}
.nav-logo-dot{width:6px;height:6px;border-radius:50%;background:var(--em);animation:pulse 2.2s ease-in-out infinite}
.nav-links{display:flex;align-items:center;gap:6px;list-style:none}
.nav-links a{font-family:'JetBrains Mono',monospace;font-size:10.5px;font-weight:400;letter-spacing:.08em;text-transform:uppercase;color:var(--text3);transition:color .18s;padding:6px 10px;border-radius:var(--r)}
.nav-links a:hover{color:var(--text);background:rgba(255,255,255,.04)}
.nav-links a.nav-active{color:var(--gold);background:var(--gold-tint)}
.nav-links .li-gold a{color:var(--em)}
.nav-cta{background:var(--gold);color:var(--inkNo response
