<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>

<title>Idowu Joshua | Elite Data Analyst Portfolio</title>

<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;800&family=Playfair+Display:wght@600;700;800;900&display=swap" rel="stylesheet">

<style>

/* ================= ROOT ================= */
:root{
--bg:#000;
--card:rgba(255,255,255,.03);
--border:rgba(255,255,255,.06);
--gold:#d4af37;
--gold2:#f6d66f;
--text:#f5f5f5;
--muted:#8d8d95;
--shadow:0 20px 70px rgba(0,0,0,.65);
}

/* ================= GLOBAL ================= */
*{margin:0;padding:0;box-sizing:border-box;}
body{
font-family:'Outfit',sans-serif;
background:#000;
color:var(--text);
overflow-x:hidden;
}

section{padding:120px 7%;}

/* ================= NAV ================= */
nav{
position:fixed;top:0;left:0;right:0;
height:78px;
display:flex;justify-content:space-between;align-items:center;
padding:0 7%;
background:rgba(0,0,0,.85);
backdrop-filter:blur(20px);
z-index:999;
border-bottom:1px solid rgba(255,255,255,.05);
}

.logo{font-size:28px;font-family:'Playfair Display';}
.logo span{color:var(--gold);}

/* ================= HERO ================= */
.hero{
min-height:100vh;
display:grid;
grid-template-columns:1.1fr 420px;
gap:60px;
align-items:center;
}

.hero-title{
font-size:90px;
font-family:'Playfair Display';
line-height:.95;
}

.hero-title span{color:var(--gold);}

.hero-desc{color:var(--muted);margin-top:20px;line-height:1.8;}

.btn{
padding:14px 26px;
border-radius:6px;
border:none;
cursor:pointer;
font-weight:700;
}

.btn-gold{background:var(--gold);color:#000;}
.btn-dark{background:#111;color:#fff;border:1px solid rgba(255,255,255,.1);}

/* ================= PROFILE ================= */
.profile-card{
background:var(--card);
border:1px solid var(--border);
border-radius:24px;
overflow:hidden;
box-shadow:var(--shadow);
}

.profile-top{padding:40px;text-align:center;}

.avatar{
width:140px;height:140px;
margin:auto;
border-radius:50%;
overflow:hidden;
border:4px solid var(--gold);
position:relative;
background:#111;
}

.avatar img{width:100%;height:100%;object-fit:cover;}

.avatar-placeholder{
position:absolute;inset:0;
display:flex;align-items:center;justify-content:center;
font-size:40px;
color:var(--gold);
font-weight:900;
}

.profile-name{margin-top:20px;font-size:28px;font-family:'Playfair Display';}
.profile-role{color:var(--gold);font-size:12px;letter-spacing:3px;}

.profile-body{padding:30px;border-top:1px solid rgba(255,255,255,.05);}

/* ================= PROJECTS ================= */
.upload-box{
margin-top:40px;
padding:40px;
border:2px dashed rgba(255,255,255,.1);
border-radius:20px;
text-align:center;
}

.upload-box input{
width:100%;
margin-top:15px;
}

.projects-grid{
margin-top:40px;
display:grid;
grid-template-columns:repeat(auto-fit,minmax(320px,1fr));
gap:25px;
}

.project-card{
background:var(--card);
border:1px solid var(--border);
border-radius:20px;
overflow:hidden;
box-shadow:var(--shadow);
transition:.3s;
}

.project-card:hover{transform:translateY(-8px);}

.project-image img{
width:100%;
height:220px;
object-fit:cover;
}

.project-content{padding:20px;}

.project-title{
font-size:22px;
font-family:'Playfair Display';
margin-top:10px;
}

.project-desc{color:var(--muted);margin-top:10px;line-height:1.7;}

.tool{
display:inline-block;
padding:6px 10px;
background:rgba(212,175,55,.1);
color:var(--gold);
border-radius:999px;
font-size:11px;
margin:4px 4px 0 0;
}

.meta{
font-size:11px;
color:#888;
margin-top:10px;
}

/* ================= CONTACT ================= */
.contact{
text-align:center;
padding:80px;
background:var(--card);
border-radius:30px;
margin-top:80px;
}

</style>
</head>

<body>

<nav>
<div class="logo">Idowu <span>Joshua</span></div>
<a class="btn btn-gold" href="#projects">View Work</a>
</nav>

<!-- HERO -->
<section class="hero">

<div>
<h1 class="hero-title">Turning <span>Data</span><br>Into Decisions</h1>
<p class="hero-desc">
Professional Data Analyst specializing in Power BI, SQL & Excel dashboards.
</p>

<div style="margin-top:20px;display:flex;gap:10px;">
<button class="btn btn-gold">Hire Me</button>
<button class="btn btn-dark">Contact</button>
</div>
</div>

<!-- PROFILE -->
<div class="profile-card">

<div class="profile-top">

<div class="avatar">
<img id="avatarImg">
<div class="avatar-placeholder" id="avatarPlaceholder">IJ</div>
</div>

<input type="file" id="avatarUpload" accept="image/*">

<div class="profile-name">Idowu Joshua</div>
<div class="profile-role">Data Analyst</div>

</div>

</div>

</section>

<!-- PROJECTS -->
<section id="projects">

<h2>Portfolio Reports</h2>

<!-- NEW UPLOAD FORM -->
<div class="upload-box">

<input type="text" id="reportTitle" placeholder="Report Title">
<textarea id="reportDesc" placeholder="Report Description"></textarea>

<select id="reportCategory">
<option>Power BI</option>
<option>Excel</option>
<option>SQL</option>
<option>Other</option>
</select>

<input type="text" id="reportTools" placeholder="Tools (comma separated)">
<input type="file" id="projectUpload" multiple accept="image/*">

</div>

<div class="projects-grid" id="projectsGrid"></div>

</section>

<!-- CONTACT -->
<section>
<div class="contact">
<h2>Let's Work Together</h2>
<p>Email: yourmail@gmail.com</p>
</div>
</section>

<script>

/* ================= AVATAR ================= */
const avatarUpload = document.getElementById('avatarUpload');
const avatarImg = document.getElementById('avatarImg');
const avatarPlaceholder = document.getElementById('avatarPlaceholder');

avatarUpload.addEventListener('change', e=>{
const file = e.target.files[0];
const reader = new FileReader();
reader.onload = ev=>{
avatarImg.src = ev.target.result;
avatarPlaceholder.style.display='none';
localStorage.setItem('avatar', ev.target.result);
};
reader.readAsDataURL(file);
});

window.onload=()=>{
const saved = localStorage.getItem('avatar');
if(saved){
avatarImg.src=saved;
avatarPlaceholder.style.display='none';
}
loadProjects();
};

/* ================= PROJECTS ================= */
let projects = JSON.parse(localStorage.getItem('projects')) || [];

const upload = document.getElementById('projectUpload');
const grid = document.getElementById('projectsGrid');

upload.addEventListener('change', e=>{
const files = [...e.target.files];

files.forEach(file=>{
const reader = new FileReader();

reader.onload = ev=>{

const project = {
image:ev.target.result,
title:document.getElementById('reportTitle').value || file.name,
desc:document.getElementById('reportDesc').value || "No description",
category:document.getElementById('reportCategory').value,
tools:(document.getElementById('reportTools').value||"").split(",").map(t=>t.trim()),
date:new Date().toLocaleDateString()
};

projects.push(project);
localStorage.setItem('projects',JSON.stringify(projects));
loadProjects();
};

reader.readAsDataURL(file);
});
});

/* ================= RENDER ================= */
function loadProjects(){

grid.innerHTML="";

if(projects.length===0){
grid.innerHTML="<p>No reports uploaded yet</p>";
return;
}

projects.forEach((p,i)=>{

const card=document.createElement('div');
card.className="project-card";

card.innerHTML=`
<img src="${p.image}">
<div class="project-content">

<div class="meta">${p.category} • ${p.date}</div>

<div class="project-title">${p.title}</div>

<div class="project-desc">${p.desc}</div>

<div style="margin-top:10px;">
${p.tools.map(t=>`<span class="tool">${t}</span>`).join('')}
</div>

</div>
`;

grid.appendChild(card);
});
}

</script>

</body>
</html>
