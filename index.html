<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Idowu Joshua — Data Analyst Portfolio</title>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,300;0,9..144,700;0,9..144,800;1,9..144,700;1,9..144,800&family=Cabinet+Grotesk:wght@300;400;500;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet"/>
<style>
:root{
  --ink:#07080a;--ink2:#0d0f13;--ink3:#13161c;--ink4:#191d26;--ink5:#1f232e;
  --rim:#252933;--rim2:#2e3444;
  --gold:#c9a84c;--gold2:#dbbe78;--gold-glow:rgba(201,168,76,.07);--gold-tint:rgba(201,168,76,.11);
  --em:#27b577;--em-dim:rgba(39,181,119,.08);
  --sky:#3d8ef0;--sky-dim:rgba(61,142,240,.07);
  --rose:#e04f69;
  --text:#e8ecf3;--text2:#8090a8;--text3:#4e5a6e;
  --r:6px;--r2:12px;--r3:18px;
  --nav-h:64px;
}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
html{scroll-behavior:smooth}
body{background:var(--ink);color:var(--text);font-family:'Cabinet Grotesk',sans-serif;font-weight:400;line-height:1.65;overflow-x:hidden;-webkit-font-smoothing:antialiased}
 
/* subtle dot grid */
body::before{content:'';position:fixed;inset:0;z-index:0;pointer-events:none;
  background-image:radial-gradient(circle,rgba(201,168,76,.07) 1px,transparent 1px);
  background-size:44px 44px;opacity:.55}
 
/* ambient glows */
.glow-blob{position:fixed;border-radius:50%;pointer-events:none;z-index:0;filter:blur(80px)}
.gb1{width:800px;height:800px;top:-200px;right:-150px;background:rgba(201,168,76,.035)}
.gb2{width:600px;height:600px;bottom:-150px;left:-80px;background:rgba(39,181,119,.03)}
.gb3{width:400px;height:400px;top:45%;left:45%;background:rgba(61,142,240,.02)}
 
img{display:block;max-width:100%}
a{color:inherit;text-decoration:none}
button{cursor:pointer;font-family:inherit}
::selection{background:rgba(201,168,76,.25);color:var(--text)}
 
::-webkit-scrollbar{width:4px}
::-webkit-scrollbar-track{background:var(--ink)}
::-webkit-scrollbar-thumb{background:var(--rim2);border-radius:2px}
::-webkit-scrollbar-thumb:hover{background:var(--gold)}
 
.z1{position:relative;z-index:1}
.wrap{max-width:1180px;margin:0 auto;padding:0 56px}
 
/* ── REVEAL ── */
.reveal{opacity:0;transform:translateY(24px);transition:opacity .6s cubic-bezier(.22,.68,0,1.2),transform .6s cubic-bezier(.22,.68,0,1.2)}
.reveal.vis{opacity:1;transform:none}
 
/* ── EYEBROW ── */
.eyebrow{display:inline-flex;align-items:center;gap:8px;font-family:'JetBrains Mono',monospace;font-size:9.5px;font-weight:500;letter-spacing:.26em;text-transform:uppercase;color:var(--gold);margin-bottom:12px}
.eyebrow::before{content:'';width:20px;height:1px;background:currentColor;opacity:.6}
 
/* ── HEADING ── */
.heading{font-family:'Fraunces',serif;font-size:clamp(34px,4.8vw,58px);font-weight:800;line-height:1.0;letter-spacing:-1.5px;color:var(--text);margin-bottom:16px}
.heading em{font-style:italic;color:var(--gold)}
 
/* ── TAGS ── */
.tag{display:inline-block;padding:3px 10px;font-size:9.5px;font-weight:500;letter-spacing:.1em;text-transform:uppercase;border-radius:100px}
.t-gold{background:var(--gold-tint);color:var(--gold);border:1px solid rgba(201,168,76,.22)}
.t-em{background:var(--em-dim);color:var(--em);border:1px solid rgba(39,181,119,.2)}
.t-sky{background:var(--sky-dim);color:var(--sky);border:1px solid rgba(61,142,240,.18)}
.t-dim{background:rgba(255,255,255,.04);color:var(--text3);border:1px solid var(--rim)}
 
/* ── BUTTONS ── */
.btn{display:inline-flex;align-items:center;gap:7px;padding:12px 24px;border-radius:var(--r);font-family:'Cabinet Grotesk',sans-serif;font-size:13px;font-weight:700;letter-spacing:.03em;transition:all .2s;border:none;cursor:pointer}
.btn-gold{background:var(--gold);color:var(--ink)}
.btn-gold:hover{background:var(--gold2);transform:translateY(-2px);box-shadow:0 8px 28px rgba(201,168,76,.22)}
.btn-outline{background:transparent;color:var(--text2);border:1px solid var(--rim2)}
.btn-outline:hover{border-color:var(--gold);color:var(--gold)}
.btn-em{background:var(--em-dim);color:var(--em);border:1px solid rgba(39,181,119,.2)}
.btn-em:hover{background:rgba(39,181,119,.13);transform:translateY(-2px)}
 
/* ══════ NAV ══════ */
#nav{position:fixed;top:0;left:0;right:0;z-index:400;height:var(--nav-h);display:flex;align-items:center;justify-content:space-between;padding:0 56px;background:rgba(7,8,10,.9);backdrop-filter:blur(20px) saturate(160%);border-bottom:1px solid var(--rim);transition:box-shadow .3s}
#nav.scrolled{box-shadow:0 4px 40px rgba(0,0,0,.45)}
.nav-logo{font-family:'Fraunces',serif;font-size:18px;font-weight:700;color:var(--text);letter-spacing:-.3px;display:flex;align-items:center;gap:6px}
.nav-logo em{color:var(--gold);font-style:italic}
.nav-logo-dot{width:6px;height:6px;border-radius:50%;background:var(--em);animation:pulse 2.2s ease-in-out infinite}
.nav-links{display:flex;align-items:center;gap:6px;list-style:none}
.nav-links a{font-family:'JetBrains Mono',monospace;font-size:10.5px;font-weight:400;letter-spacing:.08em;text-transform:uppercase;color:var(--text3);transition:color .18s;padding:6px 10px;border-radius:var(--r)}
.nav-links a:hover{color:var(--text);background:rgba(255,255,255,.04)}
.nav-links a.nav-active{color:var(--gold);background:var(--gold-tint)}
.nav-links .li-gold a{color:var(--em)}
.nav-cta{background:var(--gold);color:var(--ink);padding:8px 18px;border-radius:var(--r);font-size:12px;font-weight:700;letter-spacing:.05em;transition:all .2s}
.nav-cta:hover{background:var(--gold2);transform:translateY(-1px)}
.hamburger{display:none;background:none;border:none;color:var(--text2);font-size:22px}
#drawer{display:none;position:fixed;top:var(--nav-h);left:0;right:0;z-index:399;background:var(--ink2);border-bottom:1px solid var(--rim);padding:16px 20px 24px;flex-direction:column}
#drawer.open{display:flex}
#drawer a{display:block;padding:11px 0;font-size:13px;font-weight:500;color:var(--text2);border-bottom:1px solid var(--rim);transition:color .2s}
#drawer a:hover{color:var(--gold)}
#drawer .d-cta{margin-top:16px;text-align:center;background:var(--gold);color:var(--ink);padding:12px;border-radius:var(--r);font-weight:700}
 
/* ══════ SPA ══════ */
.page{display:none}
.page.active{display:block}
.ticker-wrap{display:none}
.ticker-wrap.active{display:block}
 
/* ══════ HOME / HERO ══════ */
#home{min-height:100vh;display:flex;flex-direction:column;justify-content:center;padding:calc(var(--nav-h) + 60px) 56px 80px;position:relative;overflow:hidden}
 
/* diagonal accent lines */
#home::after{content:'';position:absolute;inset:0;pointer-events:none;
background:linear-gradient(135deg,transparent 48%,rgba(201,168,76,.015) 50%,transparent 52%),
             linear-gradient(135deg,transparent 38%,rgba(201,168,76,.01) 40%,transparent 42%);
z-index:0}
 
.hero-layout{display:grid;grid-template-columns:1fr 400px;gap:72px;align-items:center;max-width:1180px;margin:0 auto;width:100%;position:relative;z-index:1}
 
/* hero left */
.hero-avail{display:inline-flex;align-items:center;gap:8px;background:rgba(39,181,119,.07);border:1px solid rgba(39,181,119,.18);padding:6px 14px;border-radius:100px;font-family:'JetBrains Mono',monospace;font-size:9.5px;font-weight:500;letter-spacing:.12em;text-transform:uppercase;color:var(--em);margin-bottom:28px}
.avail-dot{width:7px;height:7px;border-radius:50%;background:var(--em);animation:pulse 2.2s ease-in-out infinite}
@keyframes pulse{0%,100%{box-shadow:0 0 0 0 rgba(39,181,119,.5)}50%{box-shadow:0 0 0 5px rgba(39,181,119,0)}}
 
.hero-name{font-family:'Fraunces',serif;font-size:clamp(52px,7vw,90px);font-weight:800;line-height:.92;letter-spacing:-2px;margin-bottom:16px}
.hero-name .n1{display:block;color:var(--text)}
.hero-name .n2{display:block;color:var(--gold);font-style:italic}
 
.hero-title{font-family:'JetBrains Mono',monospace;font-size:11px;font-weight:400;letter-spacing:.2em;text-transform:uppercase;color:var(--text3);margin-bottom:22px}
 
.hero-bio{font-size:15px;color:var(--text2);max-width:460px;line-height:1.9;margin-bottom:34px}
.hero-bio strong{color:var(--text);font-weight:500}
 
.hero-ctas{display:flex;flex-wrap:wrap;gap:10px;margin-bottom:48px}
 
.hero-stats{display:flex;gap:40px;flex-wrap:wrap;padding-top:32px;border-top:1px solid var(--rim)}
.hs-num{font-family:'Fraunces',serif;font-size:40px;font-weight:800;color:var(--gold);line-height:1;letter-spacing:-1px}
.hs-lbl{font-family:'JetBrains Mono',monospace;font-size:9px;font-weight:400;letter-spacing:.14em;text-transform:uppercase;color:var(--text3);margin-top:4px}
 
/* hero right — card */
.hero-card{background:var(--ink2);border:1px solid var(--rim);border-radius:var(--r3);overflow:hidden;box-shadow:0 40px 80px rgba(0,0,0,.5)}
.hc-top{position:relative;padding:32px 24px 24px;text-align:center;border-bottom:1px solid var(--rim);background:var(--ink3)}
 
.hc-top::before,.hc-top::after{content:'';position:absolute;width:28px;height:28px;border-color:rgba(201,168,76,.2);border-style:solid}
.hc-top::before{top:12px;left:12px;border-width:1px 0 0 1px;border-radius:3px 0 0 0}
.hc-top::after{top:12px;right:12px;border-width:1px 1px 0 0;border-radius:0 3px 0 0}
 
.avatar-wrap{width:100px;height:100px;border-radius:50%;border:2px solid var(--gold);background:var(--ink3);display:flex;align-items:center;justify-content:center;margin:0 auto 16px;position:relative;overflow:hidden;cursor:pointer;box-shadow:0 0 0 5px rgba(201,168,76,.06)}
.avatar-wrap:hover .av-overlay{opacity:1}
.avatar-wrap img{width:100%;height:100%;object-fit:cover;border-radius:50%;position:absolute;inset:0;display:none}
.avatar-wrap img.show{display:block}
.av-init{font-family:'Fraunces',serif;font-size:32px;font-weight:800;color:var(--gold)}
.av-overlay{position:absolute;inset:0;border-radius:50%;background:rgba(0,0,0,.65);display:flex;flex-direction:column;align-items:center;justify-content:center;opacity:0;transition:opacity .2s;z-index:2}
.av-overlay svg{flex-shrink:0}
.av-overlay span{font-size:8px;font-weight:600;letter-spacing:.1em;color:#fff;text-transform:uppercase;margin-top:3px}
.avatar-input{position:absolute;inset:0;opacity:0;cursor:pointer;z-index:3}
 
.hc-name{font-family:'Fraunces',serif;font-size:20px;font-weight:700;color:var(--text)}
.hc-role{font-family:'JetBrains Mono',monospace;font-size:9.5px;font-weight:400;letter-spacing:.16em;text-transform:uppercase;color:var(--gold);margin-top:4px}
.hc-loc{font-size:11.5px;color:var(--text3);margin-top:5px}
 
.hc-body{padding:20px}
.hc-metric{display:flex;align-items:center;justify-content:space-between;padding:11px 13px;background:var(--ink3);border:1px solid var(--rim);border-radius:var(--r);margin-bottom:9px}
.hc-metric:last-of-type{margin-bottom:14px}
.hm-label{font-family:'JetBrains Mono',monospace;font-size:9px;font-weight:400;letter-spacing:.1em;text-transform:uppercase;color:var(--text3)}
.hm-bar{height:2px;background:var(--rim2);border-radius:2px;margin-top:5px;overflow:hidden}
.hm-fill{height:100%;border-radius:2px;animation:barIn 1.8s ease-out forwards}
.fill-gold{background:linear-gradient(90deg,var(--gold),var(--gold2))}
.fill-em{background:linear-gradient(90deg,var(--em),#4de09a)}
@keyframes barIn{from{transform:scaleX(0);transform-origin:left}to{transform:scaleX(1)}}
.hm-val{font-family:'Fraunces',serif;font-size:19px;font-weight:700;flex-shrink:0;margin-left:10px}
.hm-gold{color:var(--gold)}
.hm-em{color:var(--em)}
 
.hc-tags{display:flex;flex-wrap:wrap;gap:6px}
 
/* ── HOME REPORTS PREVIEW ── */
#home-reports-section{max-width:1180px;margin:0 auto;padding:0 56px 0;position:relative;z-index:1}
.home-reports-preview{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:20px;margin-top:32px}
 
.home-rp-card{background:var(--ink2);border:1px solid var(--rim);border-radius:var(--r2);overflow:hidden;cursor:pointer;transition:all .4s cubic-bezier(0.2, 0.8, 0.2, 1);display:flex;flex-direction:column}
.home-rp-card:hover{transform:translateY(-8px);border-color:rgba(201,168,76,.4);box-shadow:0 30px 70px rgba(0,0,0,.6)}
.home-rp-img{height:200px;overflow:hidden;position:relative;background:var(--ink3)}
.home-rp-img img{width:100%;height:100%;object-fit:cover;transition:transform .7s cubic-bezier(0.2, 0.8, 0.2, 1)}
.home-rp-card:hover .home-rp-img img{transform:scale(1.1)}
.home-rp-img-overlay{position:absolute;inset:0;background:linear-gradient(to top,rgba(7,8,10,0.9) 0%,transparent 70%);opacity:0.6;transition:opacity 0.3s}
.home-rp-card:hover .home-rp-img-overlay{opacity:0.9}
.home-rp-badge{position:absolute;top:12px;left:12px;z-index:2}
.home-rp-info{padding:20px;flex-grow:1;display:flex;flex-direction:column;justify-content:space-between}
.home-rp-title{font-family:'Fraunces',serif;font-size:18px;font-weight:700;color:var(--text);margin-bottom:8px;line-height:1.3}
.home-rp-meta{font-family:'JetBrains Mono',monospace;font-size:10px;font-weight:400;letter-spacing:.1em;text-transform:uppercase;color:var(--text3);margin-bottom:12px}
.home-rp-cta{font-size:11px;font-weight:600;color:var(--gold);display:flex;align-items:center;gap:6px;margin-top:auto}
.home-rp-cta svg{transition:transform 0.3s}
.home-rp-card:hover .home-rp-cta svg{transform:translateX(4px)}
 
.no-reports-hint{text-align:center;padding:48px 20px;background:var(--ink2);border:1px dashed var(--rim2);border-radius:var(--r2);color:var(--text3);font-size:13px;margin-top:32px}
.no-reports-hint .nrh-icon{font-size:32px;margin-bottom:12px;opacity:.5}
.no-reports-hint strong{display:block;font-size:15px;color:var(--text2);margin-bottom:6px}
 
/* ══════ TICKER ══════ */
.ticker-wrap{overflow:hidden;border-top:1px solid var(--rim);border-bottom:1px solid var(--rim);padding:11px 0;background:var(--ink2);position:relative;z-index:1}
.ticker-inner{display:flex;animation:ticker 34s linear infinite;width:max-content}
.ticker-inner:hover{animation-play-state:paused}
.ticker-item{font-family:'JetBrains Mono',monospace;font-size:10px;font-weight:400;letter-spacing:.15em;text-transform:uppercase;color:var(--text3);padding:0 36px;white-space:nowrap}
.ticker-item .sep{color:var(--gold);margin:0 6px}
@keyframes ticker{from{transform:translateX(0)}to{transform:translateX(-50%)}}
 
/* ══════ ABOUT ══════ */
#about{padding:110px 0;background:var(--ink2);border-top:1px solid var(--rim);border-bottom:1px solid var(--rim)}
.about-grid{display:grid;grid-template-columns:1.1fr 1fr;gap:72px;align-items:start}
.about-p{font-size:14.5px;color:var(--text2);line-height:1.9;margin-bottom:16px}
.about-p strong{color:var(--text);font-weight:500}
.fact-row{display:flex;align-items:center;gap:14px;padding:12px 16px;background:var(--ink3);border:1px solid var(--rim);border-radius:var(--r);transition:all .2s;margin-bottom:8px}
.fact-row:hover{border-color:rgba(201,168,76,.3);background:var(--ink4)}
.fact-row:last-child{margin-bottom:0}
.fi{font-size:16px;flex-shrink:0;width:28px;text-align:center}
.fl{font-family:'JetBrains Mono',monospace;font-size:9px;font-weight:400;letter-spacing:.12em;text-transform:uppercase;color:var(--text3)}
.fv{font-size:13.5px;font-weight:500;color:var(--text);margin-top:1px}
.fv a{color:var(--gold)}
.fv a:hover{text-decoration:underline}
 
/* ══════ SKILLS ══════ */
#skills{padding:110px 0}
.skills-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:1px;background:var(--rim);border:1px solid var(--rim);border-radius:var(--r2);overflow:hidden;margin-top:44px}
.sk-card{background:var(--ink2);padding:30px 24px;transition:background .2s;position:relative;overflow:hidden}
.sk-card::after{content:'';position:absolute;top:0;left:0;right:0;height:2px;background:linear-gradient(90deg,var(--gold),transparent);opacity:0;transition:opacity .3s}
.sk-card:hover{background:var(--ink3)}
.sk-card:hover::after{opacity:1}
.sk-ico{font-size:26px;margin-bottom:14px}
.sk-name{font-family:'Fraunces',serif;font-size:20px;font-weight:700;color:var(--text);margin-bottom:8px}
.sk-desc{font-size:12px;color:var(--text3);line-height:1.85;margin-bottom:16px}
.sk-bar-row{display:flex;align-items:center;gap:9px;margin-bottom:12px}
.sk-bar-out{flex:1;height:2px;background:var(--rim2);border-radius:2px;overflow:hidden}
.sk-bar-in{height:100%;background:linear-gradient(90deg,var(--gold),var(--gold2));border-radius:2px}
.sk-pct{font-family:'JetBrains Mono',monospace;font-size:10.5px;font-weight:500;color:var(--gold);width:32px;text-align:right}
.sk-tags{display:flex;flex-wrap:wrap;gap:5px}
 
/* ══════ REPORTS ══════ */
#reports{padding:110px 0;background:var(--ink);border-top:1px solid var(--rim)}
 
/* upload panel */
.upload-panel{background:var(--ink2);border:1px solid var(--rim);border-radius:var(--r2);margin-bottom:48px;overflow:hidden}
.up-header{display:flex;align-items:center;justify-content:space-between;padding:16px 24px;border-bottom:1px solid var(--rim)}
.up-title{font-family:'JetBrains Mono',monospace;font-size:10.5px;font-weight:400;letter-spacing:.12em;text-transform:uppercase;color:var(--text2);display:flex;align-items:center;gap:7px}
.up-count{font-family:'JetBrains Mono',monospace;font-size:10.5px;color:var(--text3)}
 
.drop-zone{position:relative;margin:16px;border:1.5px dashed var(--rim2);border-radius:var(--r);padding:32px 20px;text-align:center;background:var(--ink3);cursor:pointer;transition:all .22s}
.drop-zone.hovered{border-color:var(--gold);background:var(--gold-glow)}
.drop-zone input[type=file]{position:absolute;inset:0;opacity:0;cursor:pointer;width:100%}
.dz-ico{font-size:34px;margin-bottom:10px}
.dz-title{font-size:14.5px;font-weight:500;color:var(--text);margin-bottom:5px}
.dz-sub{font-size:12px;color:var(--text3)}
.dz-btn{display:inline-flex;align-items:center;gap:6px;background:var(--gold);color:var(--ink);padding:8px 20px;border-radius:var(--r);font-size:12px;font-weight:700;margin-top:14px;pointer-events:none}
 
.strip{display:flex;gap:10px;padding:12px 16px 16px;overflow-x:auto;scroll-snap-type:x mandatory}
.strip::-webkit-scrollbar{height:3px}
.strip::-webkit-scrollbar-track{background:var(--ink2)}
.strip::-webkit-scrollbar-thumb{background:var(--rim2);border-radius:2px}
.strip:empty::after{content:'Uploaded screenshots appear here';font-size:11px;color:var(--text3);padding:6px 0;white-space:nowrap}
 
.s-thumb{flex-shrink:0;width:136px;height:88px;border-radius:var(--r);overflow:hidden;border:1.5px solid var(--rim);cursor:pointer;scroll-snap-align:start;position:relative;transition:all .22s;background:var(--ink3)}
.s-thumb:hover{border-color:var(--gold);transform:translateY(-3px);box-shadow:0 8px 24px rgba(0,0,0,.45)}
.s-thumb img{width:100%;height:100%;object-fit:cover;display:block}
.s-thumb .s-label{position:absolute;bottom:0;left:0;right:0;background:linear-gradient(to top,rgba(7,8,10,.9) 0%,transparent 100%);padding:12px 6px 5px;font-size:9px;font-weight:500;color:var(--text2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;pointer-events:none}
.s-thumb .s-del{position:absolute;top:4px;right:4px;background:rgba(7,8,10,.8);color:var(--rose);width:20px;height:20px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:12px;opacity:0;transition:opacity .15s;border:1px solid rgba(224,79,105,.28);cursor:pointer}
.s-thumb:hover .s-del{opacity:1}
 
/* ── EMPTY STATE ── */
.empty-state{grid-column:1/-1;padding:70px 20px;display:flex;align-items:center;justify-content:center}
.es-inner{text-align:center;max-width:400px}
.es-icon-wrap{width:84px;height:84px;border-radius:50%;background:var(--gold-glow);border:1px solid rgba(201,168,76,.15);display:flex;align-items:center;justify-content:center;margin:0 auto 20px}
.es-h{font-family:'Fraunces',serif;font-size:24px;font-weight:700;color:var(--text);margin-bottom:9px}
.es-p{font-size:13px;color:var(--text3);line-height:1.85;margin-bottom:22px}
.es-btn{display:inline-flex;align-items:center;gap:7px;background:var(--gold);color:var(--ink);padding:12px 24px;border-radius:var(--r);border:none;font-family:'Cabinet Grotesk',sans-serif;font-size:13px;font-weight:700;transition:all .2s;cursor:pointer}
.es-btn:hover{background:var(--gold2);transform:translateY(-2px);box-shadow:0 6px 24px rgba(201,168,76,.22)}
 
/* ── REPORT GRID ── */
.report-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(360px,1fr));gap:24px}
 
.rp-card{background:var(--ink2);border:1px solid var(--rim);border-radius:var(--r2);overflow:hidden;display:flex;flex-direction:column;transition:transform .3s,border-color .3s,box-shadow .3s;cursor:default}
.rp-card:hover{transform:translateY(-6px);border-color:rgba(201,168,76,.35);box-shadow:0 28px 70px rgba(0,0,0,.5)}
 
.rp-img{position:relative;height:220px;background:var(--ink3);overflow:hidden}
.rp-img img{width:100%;height:100%;object-fit:cover;display:block;transition:transform .5s ease;cursor:zoom-in}
.rp-card:hover .rp-img img{transform:scale(1.05)}
.rp-img-overlay{position:absolute;inset:0;background:linear-gradient(to top,rgba(7,8,10,.8) 0%,transparent 48%)}
.rp-badge{position:absolute;top:12px;left:12px}
.rp-expand{position:absolute;bottom:12px;right:12px;background:rgba(201,168,76,.15);border:1px solid rgba(201,168,76,.3);color:var(--gold);width:30px;height:30px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:13px;opacity:0;transition:opacity .2s;cursor:zoom-in}
.rp-card:hover .rp-expand{opacity:1}
 
.rp-body{padding:20px 20px 0;flex:1;display:flex;flex-direction:column}
.rp-meta{display:flex;justify-content:space-between;align-items:center;margin-bottom:6px}
.rp-type{font-family:'JetBrains Mono',monospace;font-size:9px;font-weight:400;letter-spacing:.12em;text-transform:uppercase;color:var(--text3)}
.rp-yr{font-family:'JetBrains Mono',monospace;font-size:9px;color:var(--text3)}
.rp-title{font-family:'Fraunces',serif;font-size:20px;font-weight:700;color:var(--text);margin-bottom:8px;line-height:1.2}
.rp-desc{font-size:12.5px;color:var(--text3);line-height:1.8;margin-bottom:16px;flex:1}
 
.rp-details-btn{display:flex;align-items:center;justify-content:center;gap:7px;width:100%;padding:12px;background:var(--gold-tint);border:1px solid rgba(201,168,76,.22);border-radius:var(--r);font-size:12.5px;font-weight:700;color:var(--gold);letter-spacing:.03em;transition:all .2s;margin-bottom:12px;cursor:pointer}
.rp-details-btn:hover{background:rgba(201,168,76,.17);transform:translateY(-1px)}
.rp-details-btn svg{transition:transform .2s}
.rp-details-btn:hover svg{transform:translateX(3px)}
 
/* comments */
.cs-toggle{display:flex;align-items:center;gap:7px;background:none;border:none;font-family:'JetBrains Mono',monospace;font-size:9.5px;font-weight:400;letter-spacing:.1em;text-transform:uppercase;color:var(--text3);padding:0;transition:color .2s;cursor:pointer}
.cs-toggle:hover{color:var(--em)}
.cs-toggle svg{transition:transform .22s}
.cs-toggle.open svg{transform:rotate(180deg)}
.ccount{background:var(--em-dim);border:1px solid rgba(39,181,119,.18);color:var(--em);padding:1px 7px;border-radius:100px;font-size:8.5px}
.cs-body{display:none;margin-top:12px}
.cs-body.open{display:block}
.comments-list{max-height:160px;overflow-y:auto;display:flex;flex-direction:column;gap:9px;margin-bottom:10px;padding-right:3px}
.comment-item{background:var(--ink3);border:1px solid var(--rim);border-radius:var(--r);padding:9px 12px}
.ci-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:4px}
.ci-name{font-size:10.5px;font-weight:600;color:var(--gold)}
.ci-time{font-size:9.5px;color:var(--text3)}
.ci-txt{font-size:12px;color:var(--text2);line-height:1.6}
.ci-del{background:none;border:none;color:var(--text3);font-size:13px;padding:0 0 0 5px;transition:color .15s;cursor:pointer}
.ci-del:hover{color:var(--rose)}
.comments-empty{font-size:12px;color:var(--text3);padding:7px 0;text-align:center}
.comment-form{display:flex;gap:7px}
.comment-input{flex:1;background:var(--ink3);border:1px solid var(--rim);color:var(--text);padding:8px 12px;border-radius:var(--r);font-family:'Cabinet Grotesk',sans-serif;font-size:12px;outline:none;transition:border-color .2s}
.comment-input:focus{border-color:var(--em)}
.comment-input::placeholder{color:var(--text3)}
.comment-submit{background:var(--em-dim);border:1px solid rgba(39,181,119,.18);color:var(--em);padding:8px 13px;border-radius:var(--r);font-size:12px;font-weight:700;transition:all .2s;cursor:pointer}
.comment-submit:hover{background:rgba(39,181,119,.14)}
 
.rp-footer{display:flex;justify-content:space-between;align-items:center;padding:11px 20px;border-top:1px solid var(--rim);background:var(--ink3)}
.rp-tools{display:flex;flex-wrap:wrap;gap:5px}
.rp-del{background:none;border:1px solid var(--rim);color:var(--text3);padding:4px 11px;border-radius:var(--r);font-family:'JetBrains Mono',monospace;font-size:9px;font-weight:400;letter-spacing:.06em;transition:all .2s;cursor:pointer}
.rp-del:hover{border-color:var(--rose);color:var(--rose);background:rgba(224,79,105,.06)}
.rp-comments-section{border-top:1px solid var(--rim);padding:12px 20px}
 
/* ══════ EXPERIENCE ══════ */
#experience{padding:110px 0;background:var(--ink2);border-top:1px solid var(--rim);border-bottom:1px solid var(--rim)}
.tl{position:relative;padding-left:34px;max-width:760px}
.tl::before{content:'';position:absolute;left:0;top:14px;bottom:14px;width:1px;background:linear-gradient(180deg,var(--gold) 0%,rgba(201,168,76,.08) 100%)}
.tl-item{position:relative;padding-bottom:52px}
.tl-item:last-child{padding-bottom:0}
.tl-dot{position:absolute;left:-39px;top:12px;width:9px;height:9px;border-radius:50%;background:var(--gold);border:2px solid var(--ink2);box-shadow:0 0 0 3px rgba(201,168,76,.18)}
.tl-head{display:flex;justify-content:space-between;align-items:flex-start;flex-wrap:wrap;gap:8px;margin-bottom:5px}
.tl-role{font-family:'Fraunces',serif;font-size:24px;font-weight:700;color:var(--text)}
.tl-period{font-family:'JetBrains Mono',monospace;font-size:10px;font-weight:400;color:var(--gold);background:var(--gold-tint);border:1px solid rgba(201,168,76,.2);padding:4px 14px;border-radius:100px;letter-spacing:.08em}
.tl-co{font-size:13px;color:var(--text3);margin-bottom:16px}
.tl-co strong{color:var(--em)}
.tl-list{list-style:none;display:flex;flex-direction:column;gap:9px}
