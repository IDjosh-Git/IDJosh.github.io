<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Idowu Joshua | Data Analytics Portfolio</title>

<style>

/* ================= BASE ================= */
body{
margin:0;
font-family:Arial, sans-serif;
background:#050505;
color:#fff;
overflow-x:hidden;
}

/* animated background */
body::before{
content:"";
position:fixed;
inset:0;
background:radial-gradient(circle at 20% 20%, rgba(255,215,0,0.12), transparent 40%),
radial-gradient(circle at 80% 70%, rgba(0,150,255,0.08), transparent 45%);
z-index:-1;
}

/* ================= NAV ================= */
nav{
display:flex;
justify-content:space-between;
align-items:center;
padding:18px 40px;
background:rgba(20,20,20,0.6);
backdrop-filter:blur(12px);
position:sticky;
top:0;
border-bottom:1px solid #222;
}

nav a{
margin:0 12px;
color:#aaa;
font-size:14px;
}

nav a:hover{color:gold}

/* ================= HOME DASHBOARD ================= */
.hero{
padding:70px 40px 30px;
}

.hero h1{
font-size:52px;
margin:0;
}

.hero span{color:gold}

.hero p{
color:#aaa;
margin-top:10px;
}

/* KPI GRID */
.kpi-grid{
display:grid;
grid-template-columns:repeat(auto-fit,minmax(200px,1fr));
gap:20px;
margin-top:30px;
}

.kpi-card{
background:rgba(255,255,255,0.04);
border:1px solid rgba(255,255,255,0.08);
border-radius:18px;
padding:22px;
backdrop-filter:blur(10px);
box-shadow:0 10px 40px rgba(0,0,0,0.4);
transition:0.3s;
}

.kpi-card:hover{
transform:translateY(-6px);
border-color:gold;
}

.kpi-value{
font-size:34px;
font-weight:bold;
color:gold;
}

.kpi-label{
font-size:12px;
letter-spacing:1px;
color:#aaa;
margin-top:6px;
text-transform:uppercase;
}

/* DASH GRID */
.dashboard-grid{
display:grid;
grid-template-columns:2fr 1fr;
gap:20px;
margin-top:30px;
padding:0 40px 40px;
}

/* PANELS */
.panel{
background:rgba(255,255,255,0.03);
border:1px solid rgba(255,255,255,0.08);
border-radius:18px;
padding:20px;
backdrop-filter:blur(10px);
}

.panel h3{
margin:0 0 15px;
color:gold;
font-size:14px;
letter-spacing:1px;
}

/* ACTIVITY */
.activity-item{
padding:10px 0;
border-bottom:1px solid rgba(255,255,255,0.06);
}

.activity-title{font-size:13px}
.activity-meta{font-size:11px;color:#888}

/* BARS */
.bar{
height:8px;
background:#222;
border-radius:20px;
overflow:hidden;
margin:8px 0 14px;
}

.bar-fill{
height:100%;
background:linear-gradient(90deg,gold,#ffdd66);
}

/* UPLOAD */
.upload{
margin:40px;
padding:25px;
background:#111;
border-radius:18px;
border:1px solid #222;
}

input,select,textarea{
width:100%;
padding:10px;
margin:8px 0;
background:#000;
border:1px solid #333;
color:#fff;
border-radius:8px;
}

/* PROJECTS */
.projects{
padding:40px;
}

.grid{
display:grid;
grid-template-columns:repeat(auto-fit,minmax(260px,1fr));
gap:20px;
}

.card{
background:#111;
border:1px solid #222;
border-radius:16px;
overflow:hidden;
transition:0.3s;
}

.card:hover{
transform:translateY(-6px);
border-color:gold;
}

.card img{
width:100%;
height:160px;
object-fit:cover;
}

.card-body{padding:15px}

.tag{
display:inline-block;
padding:4px 8px;
background:rgba(255,215,0,0.08);
color:gold;
border-radius:20px;
font-size:11px;
margin:3px;
}

</style>
</head>

<body>

<!-- NAV -->
<nav>
<div><b>Idowu Joshua</b></div>
<div>
<a href="#home">Home</a>
<a href="#upload">Upload</a>
<a href="#projects">Projects</a>
</div>
</nav>

<!-- ================= HOME DASHBOARD ================= -->
<section id="home" class="hero">

<h1>Hi, I'm <span>Joshua</span> 👋</h1>
<p>Data Analyst • Power BI • Excel • SQL • Turning data into business decisions</p>

<!-- KPI CARDS -->
<div class="kpi-grid">

<div class="kpi-card">
<div class="kpi-value" id="totalProjects">0</div>
<div class="kpi-label">Total Projects</div>
</div>

<div class="kpi-card">
<div class="kpi-value" id="powerbi">0</div>
<div class="kpi-label">Power BI</div>
</div>

<div class="kpi-card">
<div class="kpi-value" id="excel">0</div>
<div class="kpi-label">Excel</div>
</div>

<div class="kpi-card">
<div class="kpi-value" id="sql">0</div>
<div class="kpi-label">SQL</div>
</div>

</div>

</section>

<!-- DASHBOARD DETAILS -->
<div class="dashboard-grid">

<!-- CATEGORY INSIGHT -->
<div class="panel">

<h3>📊 Category Performance</h3>

<div>Power BI</div>
<div class="bar"><div class="bar-fill" id="bar1"></div></div>

<div>Excel</div>
<div class="bar"><div class="bar-fill" id="bar2"></div></div>

<div>SQL</div>
<div class="bar"><div class="bar-fill" id="bar3"></div></div>

</div>

<!-- ACTIVITY -->
<div class="panel">

<h3>🕒 Recent Activity</h3>
<div id="activity"></div>

</div>

</div>

<!-- UPLOAD -->
<section id="upload" class="upload">

<h2>Upload Report</h2>

<input type="text" id="title" placeholder="Report Title">
<textarea id="desc" placeholder="Description"></textarea>

<select id="category">
<option>Power BI</option>
<option>Excel</option>
<option>SQL</option>
<option>Other</option>
</select>

<input type="text" id="tools" placeholder="Tools (comma separated)">
<input type="file" id="file" multiple>

</section>

<!-- PROJECTS -->
<section id="projects" class="projects">

<h2>Projects</h2>
<div class="grid" id="grid"></div>

</section>

<script>

let projects = JSON.parse(localStorage.getItem("projects")) || [];

/* SAVE */
document.getElementById("file").addEventListener("change", function(){

let files = [...this.files];

files.forEach(file=>{

let reader = new FileReader();

reader.onload = e=>{

projects.push({
image:e.target.result,
title:document.getElementById("title").value || file.name,
desc:document.getElementById("desc").value || "No description",
category:document.getElementById("category").value,
tools:(document.getElementById("tools").value||"").split(",").map(t=>t.trim()),
date:new Date().toLocaleDateString()
});

localStorage.setItem("projects",JSON.stringify(projects));

render();
home();

};

reader.readAsDataURL(file);

});

});

/* RENDER */
function render(){

let grid=document.getElementById("grid");
grid.innerHTML="";

projects.forEach(p=>{

grid.innerHTML+=`
<div class="card">
<img src="${p.image}">
<div class="card-body">

<div style="color:#888;font-size:12px">${p.category} • ${p.date}</div>
<h3>${p.title}</h3>
<p style="color:#aaa">${p.desc}</p>

<div>
${p.tools.map(t=>`<span class="tag">${t}</span>`).join("")}
</div>

</div>
</div>
`;

});

}

/* HOME DASHBOARD LOGIC */
function home(){

let total = projects.length;

let pb = projects.filter(p=>p.category==="Power BI").length;
let ex = projects.filter(p=>p.category==="Excel").length;
let sql = projects.filter(p=>p.category==="SQL").length;

document.getElementById("totalProjects").innerText=total;
document.getElementById("powerbi").innerText=pb;
document.getElementById("excel").innerText=ex;
document.getElementById("sql").innerText=sql;

function pct(v){return total? (v/total)*100 : 0;}

document.getElementById("bar1").style.width=pct(pb)+"%";
document.getElementById("bar2").style.width=pct(ex)+"%";
document.getElementById("bar3").style.width=pct(sql)+"%";

/* ACTIVITY */
let act=document.getElementById("activity");
act.innerHTML="";

projects.slice(-5).reverse().forEach(p=>{
act.innerHTML+=`
<div class="activity-item">
<div class="activity-title">${p.title}</div>
<div class="activity-meta">${p.category} • ${p.date}</div>
</div>
`;
});

}

/* INIT */
render();
home();

</script>

</body>
</html>
